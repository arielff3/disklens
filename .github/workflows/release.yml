name: Release

# Push a tag like v0.1.0 to build the installer and create a draft release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Disklens ${{ github.ref_name }}
          releaseBody: "Download the setup .exe below. It is not code-signed yet, so Windows SmartScreen may ask you to confirm: More info → Run anyway."
          releaseDraft: true
          prerelease: false
